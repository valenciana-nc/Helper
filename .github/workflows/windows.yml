name: Windows checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Compile
        run: python -m compileall -q -x ".*\\.venv.*" .

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

      - name: Install isolated browser test runtime
        run: |
          python -m pip install -r requirements-browser.txt
          python -m playwright install chromium

      - name: Browser integration checks
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $env:HELPER_TEST_BROWSER = python -c "from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()"
          python -m pytest tests/test_engine_adapters.py -k BrowserIntegration -q

